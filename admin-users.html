<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apex Capital — All Users</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --deep: #021024; --navy: #052659; --slate: #5483B3;
      --sky: #7DA0CA; --ice: #C1E8FF; --mist: #E0F2FE; --white: #FFFFFF;
      --sidebar-width: 260px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--deep); color: #fff; overflow-x: hidden; line-height: 1.6;
    }

    .app { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, rgba(5,38,89,0.6), rgba(2,16,36,0.9));
      border-right: 1px solid rgba(193,232,255,0.08);
      backdrop-filter: blur(20px);
      position: fixed; inset: 0 auto 0 0;
      z-index: 200;
      display: flex; flex-direction: column;
      padding: 24px 20px;
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(2,16,36,0.6);
      backdrop-filter: blur(4px); z-index: 199;
      display: none; opacity: 0; transition: opacity 0.3s;
    }
    .sidebar-overlay.show { display: block; opacity: 1; }
    .sidebar-brand {
      display: flex; align-items: center; gap: 12px;
      font-size: 18px; font-weight: 500; letter-spacing: -0.2px;
      text-decoration: none; color: #fff; margin-bottom: 48px;
      padding: 0 8px;
    }
    .sidebar-brand span { color: var(--ice); }
    .sidebar-brand span b { color: #fff; font-weight: 600; }
    .logo-orbital {
      width: 36px; height: 36px;
      position: relative; transform-style: preserve-3d; perspective: 200px; flex-shrink: 0;
    }
    .logo-ring {
      position: absolute; top: 50%; left: 50%; border-radius: 50%; transform-style: preserve-3d;
    }
    .logo-ring-outer {
      width: 32px; height: 32px; margin: -16px 0 0 -16px;
      border: 2px solid transparent; border-top-color: var(--sky); border-right-color: var(--ice); border-left-color: var(--slate);
      animation: spinLogo1 4s linear infinite; transform: rotateX(55deg) rotateY(15deg);
      filter: drop-shadow(0 0 8px rgba(125,160,202,0.6));
    }
    .logo-ring-mid {
      width: 24px; height: 24px; margin: -12px 0 0 -12px;
      border: 1.5px solid transparent; border-top-color: var(--ice); border-bottom-color: var(--sky);
      animation: spinLogo2 3s linear infinite reverse; transform: rotateX(-40deg) rotateY(25deg);
      filter: drop-shadow(0 0 6px rgba(193,232,255,0.4));
    }
    .logo-ring-inner {
      width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border: 1px solid transparent; border-right-color: var(--slate); border-bottom-color: var(--ice);
      animation: spinLogo3 2.5s linear infinite; transform: rotateX(25deg) rotateY(-20deg);
      filter: drop-shadow(0 0 4px rgba(84,131,179,0.5));
    }
    .logo-core {
      position: absolute; top: 50%; left: 50%;
      width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
      background: radial-gradient(circle, var(--ice) 0%, var(--sky) 70%);
      box-shadow: 0 0 12px rgba(193,232,255,0.6), 0 0 24px rgba(125,160,202,0.2);
      animation: pulseLogo 2s ease-in-out infinite;
    }
    @keyframes spinLogo1 { 0% { transform: rotateX(55deg) rotateY(15deg) rotateZ(0deg); } 100% { transform: rotateX(55deg) rotateY(15deg) rotateZ(360deg); } }
    @keyframes spinLogo2 { 0% { transform: rotateX(-40deg) rotateY(25deg) rotateZ(0deg); } 100% { transform: rotateX(-40deg) rotateY(25deg) rotateZ(360deg); } }
    @keyframes spinLogo3 { 0% { transform: rotateX(25deg) rotateY(-20deg) rotateZ(0deg); } 100% { transform: rotateX(25deg) rotateY(-20deg) rotateZ(360deg); } }
    @keyframes pulseLogo { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.9; } }

    .nav-section { margin-bottom: 28px; }
    .nav-section-title {
      font-size: 10px; font-weight: 600; color: var(--slate);
      text-transform: uppercase; letter-spacing: 1.5px;
      padding: 0 12px; margin-bottom: 12px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px;
      color: var(--sky); text-decoration: none; font-size: 13px; font-weight: 400;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      cursor: pointer; border: none; background: none; width: 100%; font-family: inherit;
    }
    .nav-item:hover {
      background: linear-gradient(135deg, rgba(193,232,255,0.06), rgba(84,131,179,0.03));
      color: var(--ice);
      transform: translateX(3px);
    }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(193,232,255,0.1), rgba(84,131,179,0.05));
      color: #fff;
      box-shadow: 0 2px 16px rgba(84,131,179,0.1), inset 0 1px 0 rgba(193,232,255,0.08);
      border: 1px solid rgba(193,232,255,0.1);
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; stroke-width: 2; }
    .sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(193,232,255,0.05); }
    .user-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border-radius: 12px;
      background: linear-gradient(160deg, rgba(193,232,255,0.04), rgba(84,131,179,0.02));
      border: 1px solid rgba(193,232,255,0.06);
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
    }
    .user-pill:hover {
      background: linear-gradient(160deg, rgba(193,232,255,0.08), rgba(84,131,179,0.04));
      border-color: rgba(193,232,255,0.12);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(2,16,36,0.25);
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--slate), var(--sky));
      display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--deep);
    }
    .user-info { text-align: left; }
    .user-name { font-size: 12px; font-weight: 500; color: #fff; }
    .user-role { font-size: 11px; color: var(--slate); }

    .main { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; position: relative; }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2,16,36,0.85); backdrop-filter: blur(20px) saturate(1.1);
      border-bottom: 1px solid rgba(193,232,255,0.05);
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-logo-display {
      display: flex; align-items: center; gap: 10px;
    }
    .topbar-logo-display .logo-orbital {
      width: 28px; height: 28px;
    }
    .topbar-logo-display .logo-ring-outer {
      width: 24px; height: 24px; margin: -12px 0 0 -12px;
      border-width: 1.5px;
    }
    .topbar-logo-display .logo-ring-mid {
      width: 18px; height: 18px; margin: -9px 0 0 -9px;
      border-width: 1px;
    }
    .topbar-logo-display .logo-ring-inner {
      width: 12px; height: 12px; margin: -6px 0 0 -6px;
      border-width: 1px;
    }
    .topbar-logo-display .logo-core {
      width: 4px; height: 4px; margin: -2px 0 0 -2px;
    }
    .topbar-logo-text {
      font-size: 16px; font-weight: 500; letter-spacing: -0.2px; color: #fff;
    }
    .topbar-logo-text span { color: var(--ice); }
    .topbar-logo-text span b { color: #fff; font-weight: 600; }
    .admin-badge {
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 5px;
      background: linear-gradient(135deg, var(--slate), var(--sky));
      color: var(--deep);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(193,232,255,0.03); border: 1px solid rgba(193,232,255,0.06);
      display: grid; place-items: center; color: var(--sky);
      cursor: pointer; transition: all 0.25s ease;
    }
    .icon-btn:hover {
      background: rgba(193,232,255,0.08); border-color: rgba(193,232,255,0.14);
      color: var(--ice); transform: translateY(-1px);
    }
    .icon-btn svg { width: 16px; height: 16px; }
    .mobile-toggle {
      display: none; background: none; border: none; color: var(--ice); cursor: pointer;
    }

    /* Page Content */
    .page-content {
      padding: 28px;
      max-width: 1400px;
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .page-header { margin-bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
    .page-header h1 { font-size: 24px; font-weight: 500; letter-spacing: -0.5px; margin-bottom: 4px; }
    .page-header h1 .grad {
      background: linear-gradient(135deg, #fff 20%, var(--sky) 60%, var(--ice) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .page-header p { color: var(--sky); font-size: 12px; font-weight: 400; }

    /* Panel */
    .panel {
      padding: 24px; border-radius: 22px;
      background: linear-gradient(165deg, rgba(193,232,255,0.06), rgba(84,131,179,0.02));
      border: 1px solid rgba(193,232,255,0.08);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      animation: slideUp 0.7s ease forwards;
      opacity: 0;
    }
    .panel:hover {
      border-color: rgba(193,232,255,0.14);
      box-shadow: 0 16px 40px rgba(2,16,36,0.3), 0 0 0 1px rgba(193,232,255,0.04);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Panel loader */
    .panel-loader {
      position: absolute;
      inset: 0;
      background: rgba(2,16,36,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      border-radius: 22px;
    }
    .panel-loader.show {
      opacity: 1;
      pointer-events: all;
    }
    .panel-loader .mini-orbital {
      width: 44px; height: 44px;
      position: relative;
      transform-style: preserve-3d;
      perspective: 200px;
      margin-bottom: 10px;
    }
    .panel-loader .mini-ring {
      position: absolute; top: 50%; left: 50%;
      border-radius: 50%; border: 1.5px solid transparent;
      transform-style: preserve-3d;
    }
    .panel-loader .mini-ring-1 {
      width: 36px; height: 36px; margin: -18px 0 0 -18px;
      border-top-color: var(--sky); border-right-color: var(--ice);
      animation: spinLogo1 2.5s linear infinite;
      transform: rotateX(55deg) rotateY(15deg);
    }
    .panel-loader .mini-ring-2 {
      width: 26px; height: 26px; margin: -13px 0 0 -13px;
      border-bottom-color: var(--sky); border-left-color: var(--ice);
      animation: spinLogo2 2s linear infinite reverse;
      transform: rotateX(-40deg) rotateY(25deg);
    }
    .panel-loader .mini-core {
      position: absolute; top: 50%; left: 50%;
      width: 6px; height: 6px; margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--ice);
      box-shadow: 0 0 10px rgba(193,232,255,0.5);
      animation: pulseLogo 1.5s ease-in-out infinite;
    }
    .panel-loader p {
      font-size: 10px;
      color: var(--sky);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-input {
      flex: 1; min-width: 200px; padding: 8px 14px;
      background: rgba(193,232,255,0.03);
      border: 1px solid rgba(193,232,255,0.08);
      border-radius: 10px; color: #fff; font-size: 13px; font-family: inherit;
      outline: none; transition: all 0.25s ease;
    }
    .filter-input:focus {
      border-color: var(--sky); background: rgba(193,232,255,0.05);
      box-shadow: 0 0 0 2px rgba(125,160,202,0.06);
    }
    .filter-input::placeholder { color: var(--slate); }
    .filter-select {
      padding: 8px 14px;
      background: rgba(193,232,255,0.03);
      border: 1px solid rgba(193,232,255,0.08);
      border-radius: 10px; color: #fff; font-size: 13px; font-family: inherit;
      outline: none; cursor: pointer;
    }
    .filter-select option { background: var(--navy); color: #fff; }

    /* Data Table */
    .table-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
    }
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(193,232,255,0.12) transparent;
    }
    .table-scroll::-webkit-scrollbar { height: 5px; }
    .table-scroll::-webkit-scrollbar-thumb { background: rgba(193,232,255,0.12); border-radius: 3px; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 640px; }
    .data-table th {
      text-align: left; padding: 12px 14px;
      font-size: 9px; font-weight: 600; color: var(--slate);
      text-transform: uppercase; letter-spacing: 1.2px;
      border-bottom: 1px solid rgba(193,232,255,0.06);
      white-space: nowrap;
    }
    .data-table td {
      padding: 14px; font-size: 11px;
      border-bottom: 1px solid rgba(193,232,255,0.03);
      color: var(--sky);
      white-space: nowrap;
    }
    .data-table tbody tr {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .data-table tbody tr:hover {
      background: rgba(193,232,255,0.05);
    }
    .data-table .user-cell {
      display: flex; align-items: center; gap: 10px;
    }
    .data-table .user-avatar-sm {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, var(--slate), var(--sky));
      display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--deep);
      flex-shrink: 0;
    }
    .data-table .user-name-sm { font-weight: 500; color: #fff; font-size: 12px; }
    .data-table .user-email-sm { font-size: 10px; color: var(--slate); margin-top: 2px; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 16px;
      font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .status-badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
    }
    .status-active {
      background: rgba(46, 204, 113, 0.06);
      border: 1px solid rgba(46, 204, 113, 0.15);
      color: #2ecc71;
    }
    .status-active::before { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
    .status-pending {
      background: rgba(241, 196, 15, 0.06);
      border: 1px solid rgba(241, 196, 15, 0.15);
      color: #f1c40f;
    }
    .status-pending::before { background: #f1c40f; box-shadow: 0 0 5px #f1c40f; }
    .status-suspended, .status-locked {
      background: rgba(231, 76, 60, 0.06);
      border: 1px solid rgba(231, 76, 60, 0.15);
      color: #e74c3c;
    }
    .status-suspended::before, .status-locked::before { background: #e74c3c; box-shadow: 0 0 5px #e74c3c; }
    .role-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 6px; border-radius: 5px;
      font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
      background: rgba(125,160,202,0.06);
      border: 1px solid rgba(125,160,202,0.14);
      color: var(--sky);
    }

    /* Pagination */
    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 20px;
    }
    .page-btn {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(193,232,255,0.03); border: 1px solid rgba(193,232,255,0.06);
      color: var(--sky); display: grid; place-items: center;
      cursor: pointer; transition: all 0.2s ease; font-size: 12px; font-family: inherit;
    }
    .page-btn:hover, .page-btn.active {
      background: linear-gradient(135deg, var(--slate), var(--sky));
      color: var(--deep); border-color: transparent;
    }

    /* Toast */
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, var(--slate), var(--sky)); color: var(--deep); padding: 12px 24px; border-radius: 12px; font-size: 13px; font-weight: 500; box-shadow: 0 12px 36px rgba(84,131,179,0.3); z-index: 10000; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Mobile Cards */
    .user-card {
      display: none;
      padding: 14px; border-radius: 14px;
      background: linear-gradient(160deg, rgba(193,232,255,0.04), rgba(84,131,179,0.01));
      border: 1px solid rgba(193,232,255,0.06);
      margin-bottom: 10px;
      animation: slideUp 0.45s ease forwards;
      opacity: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .user-card:hover {
      background: linear-gradient(160deg, rgba(193,232,255,0.07), rgba(84,131,179,0.03));
      border-color: rgba(193,232,255,0.1);
    }
    .user-card-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .user-card-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .user-card-field { font-size: 10px; color: var(--slate); font-weight: 400; }
    .user-card-value { font-size: 11px; color: #fff; font-weight: 500; margin-top: 2px; }

    @media (max-width: 768px) {
      body { font-size: 14px; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .mobile-toggle { display: block; }
      .topbar { padding: 12px 14px; }
      .page-content { padding: 14px; }
      .page-header h1 { font-size: 20px; }
      .panel { padding: 16px; border-radius: 18px; }
      .data-table { display: none; }
      .user-card { display: block; }
      .topbar-logo-display .logo-orbital { width: 24px; height: 24px; }
      .topbar-logo-display .logo-ring-outer { width: 20px; height: 20px; margin: -10px 0 0 -10px; }
      .topbar-logo-display .logo-ring-mid { width: 14px; height: 14px; margin: -7px 0 0 -7px; }
      .topbar-logo-display .logo-ring-inner { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; }
      .topbar-logo-display .logo-core { width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; }
      .topbar-logo-text { font-size: 14px; }
      .admin-badge { font-size: 8px; padding: 2px 6px; margin-left: 5px; }
    }
  </style>

      </div>

      <div class="sidebar-footer">
        <a href="admin-profile.html" class="user-pill" id="userPill">
          <div class="user-avatar" id="userAvatar">AD</div>
          <div class="user-info">
            <div class="user-name" id="userName">Admin</div>
            <div class="user-role">Super Administrator</div>
          </div>
        </a>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main -->
    <main class="main">
      <!-- Topbar -->
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="mobile-toggle" onclick="toggleSidebar()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topbar-logo-display">
            <div class="logo-orbital">
              <div class="logo-ring logo-ring-outer"></div>
              <div class="logo-ring logo-ring-mid"></div>
              <div class="logo-ring logo-ring-inner"></div>
              <div class="logo-core"></div>
            </div>
            <div class="topbar-logo-text">Apex <span><b>Capital</b></span></div>
            <span class="admin-badge">Admin</span>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>All <span class="grad">Users</span></h1>
            <p>Manage and review every account in the system.</p>
          </div>
        </div>

        <div class="panel">
          <!-- Panel Loader -->
          <div class="panel-loader show" id="usersPanelLoader">
            <div class="mini-orbital">
              <div class="mini-ring mini-ring-1"></div>
              <div class="mini-ring mini-ring-2"></div>
              <div class="mini-core"></div>
            </div>
            <p>Loading users...</p>
          </div>

          <div class="filter-bar">
            <input type="text" class="filter-input" id="userSearch" placeholder="Search by name, email, or ID..." oninput="filterUsers()">
            <select class="filter-select" id="userStatusFilter" onchange="filterUsers()">
              <option value="all">All Status</option>
              <option value="active">Active</option>
              <option value="pending">Pending</option>
              <option value="locked">Locked</option>
            </select>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="data-table" id="usersTable">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>User ID</th>
                    <th>Joined</th>
                    <th>Balance</th>
                    <th>Pending</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>

          <!-- Mobile Cards -->
          <div id="usersCards"></div>

          <div class="pagination" id="usersPagination"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = 'https://nexusbank-jjy2.onrender.com/api/V1';
    const token = localStorage.getItem('apex_token');
    let allUsers = [];
    let currentPage = 1;
    const perPage = 10;

    if (!token) {
      window.location.href = 'auth.html#login';
    }

    async function apiGet(endpoint) {
      try {
        const res = await fetch(API_BASE + endpoint, {
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Request failed');
        return data;
      } catch (err) {
        console.error('API Error:', err);
        return null;
      }
    }

    async function loadProfile() {
      const data = await apiGet('/user/viewProfile');
      if (data) {
        const userArr = data.data || data.user || data;
        const user = Array.isArray(userArr) ? userArr[0] : userArr;
        if (!user) return;
        const fullName = user.fullname || user.name || 'Admin';
        document.getElementById('userName').textContent = fullName;
        document.getElementById('userAvatar').textContent = fullName.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
      }
    }

    function getUserStatus(u) {
      if (u.loanStatus === 'Locked') return 'locked';
      if (u.status) return u.status.toLowerCase();
      const balance = parseFloat(u.availableBalance || u.totalBalance || u.balance || 0);
      if (balance > 0) return 'active';
      return 'pending';
    }

    function hidePanelLoader(id) {
      const loader = document.getElementById(id);
      if (loader) {
        loader.classList.remove('show');
        setTimeout(() => { loader.style.display = 'none'; }, 300);
      }
    }

    async function loadAllUsers() {
      const data = await apiGet('/admin/allUsers');
      console.log(data)
      let users = [];
      
      // Correct extraction: data.data[0] contains the users array
      if (data && Array.isArray(data.data) && data.data.length > 0) {
        users = Array.isArray(data.data[0]) ? data.data[0] : [];
      }

      if (users.length === 0) {
        showToast('Could not load users from API — showing demo data', 'error');
        users = [
          { _id: '1', fullname: 'Sarah Chen', email: 'sarah.chen@email.com', createdAt: '2026-08-20', availableBalance: '12745.00', pendingBalance: '0', loanStatus: 'Active', userId: 'USER001' },
          { _id: '2', fullname: 'Mike Ross', email: 'mike.ross@email.com', createdAt: '2026-08-18', availableBalance: '8320.50', pendingBalance: '3200.00', loanStatus: 'Active', userId: 'USER002' },
          { _id: '3', fullname: 'Anna Bell', email: 'anna.bell@email.com', createdAt: '2026-08-15', availableBalance: '0', pendingBalance: '0', loanStatus: 'Locked', userId: 'USER003' },
          { _id: '4', fullname: 'James Wright', email: 'james.w@email.com', createdAt: '2026-08-10', availableBalance: '15400.00', pendingBalance: '1200.00', loanStatus: 'Active', userId: 'USER004' },
          { _id: '5', fullname: 'Emma Stone', email: 'emma.s@email.com', createdAt: '2026-08-05', availableBalance: '5400.00', pendingBalance: '0', loanStatus: 'Active', userId: 'USER005' },
        ];
      }

      allUsers = users.map((u, idx) => {
        const avail = parseFloat(u.availableBalance || 0);
        const total = parseFloat(u.totalBalance || 0);
        return {
          id: u.userId || String(idx),
          userId: u.userId || '-',
          name: u.fullname || u.name || 'Unknown',
          email: u.email || 'no-email@apex.capital',
          joined: u.createdAt || u.joined || new Date().toISOString(),
          balance: avail > 0 ? avail : (total > 0 ? total : parseFloat(u.balance || 0)),
          pendingBalance: parseFloat(u.pendingBalance || 0),
          status: getUserStatus(u),
          raw: u
        };
      });
      
      // Sort by joined date descending (most recent first)
      allUsers.sort((a, b) => new Date(b.joined) - new Date(a.joined));
      renderUsers(allUsers);
      renderUsers(allUsers);
      hidePanelLoader('usersPanelLoader');
    }
    

    function renderUsers(users, page = 1) {
      const tbody = document.getElementById('usersTableBody');
      const cards = document.getElementById('usersCards');
      const start = (page - 1) * perPage;
      const paginated = users.slice(start, start + perPage);

      if (paginated.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--slate);">No users found</td></tr>';
        cards.innerHTML = '<div style="text-align:center;padding:32px;color:var(--slate);">No users found</div>';
        document.getElementById('usersPagination').innerHTML = '';
        return;
      }

      tbody.innerHTML = paginated.map(u => `
        <tr onclick="window.location.href='admin-edit-user.html?id=${u.id}'">
          <td>
            <div class="user-cell">
              <div class="user-avatar-sm">${u.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase()}</div>
              <div>
                <div class="user-name-sm">${escapeHtml(u.name)}</div>
                <div class="user-email-sm">${escapeHtml(u.email)}</div>
              </div>
            </div>
          </td>
          <td><span class="role-badge">${u.userId}</span></td>
          <td>${new Date(u.joined).toLocaleDateString()}</td>
          <td>$${u.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
          <td>$${(u.pendingBalance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
          <td><span class="status-badge status-${u.status}">${u.status}</span></td>
        </tr>
      `).join('');

      cards.innerHTML = paginated.map(u => `
        <div class="user-card" onclick="window.location.href='admin-edit-user.html?id=${u.id}'">
          <div class="user-card-header">
            <div class="user-avatar-sm" style="width:36px;height:36px;font-size:12px;">${u.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase()}</div>
            <div style="flex:1;min-width:0;">
              <div class="user-name-sm" style="font-size:13px;">${escapeHtml(u.name)}</div>
              <div class="user-email-sm">${escapeHtml(u.email)}</div>
            </div>
            <span class="status-badge status-${u.status}">${u.status}</span>
          </div>
          <div class="user-card-body">
            <div>
              <div class="user-card-field">User ID</div>
              <div class="user-card-value">${u.userId}</div>
            </div>
            <div>
              <div class="user-card-field">Balance</div>
              <div class="user-card-value">$${u.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
            </div>
            <div>
              <div class="user-card-field">Pending</div>
              <div class="user-card-value">$${(u.pendingBalance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
            </div>
            <div>
              <div class="user-card-field">Joined</div>
              <div class="user-card-value">${new Date(u.joined).toLocaleDateString()}</div>
            </div>
          </div>
        </div>
      `).join('');

      renderPagination(users.length, page);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderPagination(total, current) {
      const pages = Math.ceil(total / perPage);
      const container = document.getElementById('usersPagination');
      if (pages <= 1) { container.innerHTML = ''; return; }

      let html = '';
      for (let i = 1; i <= pages; i++) {
        html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      filterUsers();
    }

    function filterUsers() {
      const search = document.getElementById('userSearch').value.toLowerCase();
      const status = document.getElementById('userStatusFilter').value;

      let filtered = allUsers.filter(u => {
        const matchSearch = u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search) || u.id.includes(search) || u.userId.toLowerCase().includes(search);
        const matchStatus = status === 'all' || u.status === status;
        return matchSearch && matchStatus;
      });

      renderUsers(filtered, currentPage);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    }
    function logout() {
      localStorage.removeItem('apex_token');
      window.location.href = 'auth.html#login';
    }
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      if (type === 'error') {
        toast.style.background = 'linear-gradient(135deg, #c0392b, #e74c3c)';
        toast.style.color = '#fff';
      } else if (type === 'success') {
        toast.style.background = 'linear-gradient(135deg, #27ae60, #2ecc71)';
        toast.style.color = '#fff';
      } else {
        toast.style.background = 'linear-gradient(135deg, var(--slate), var(--sky))';
        toast.style.color = 'var(--deep)';
      }
      setTimeout(() => {
        toast.classList.remove('show');
        toast.style.background = '';
        toast.style.color = '';
      }, 4000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      loadAllUsers();
    });
  </script>
</body>
</html>
